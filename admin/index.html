<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Witting</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #333; width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #e50914; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        button { width: 100%; padding: 12px; background: #e50914; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; font-family: 'Cairo'; }
        button:hover { background: #b80710; }
        #error-msg { color: #ff4444; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>دخول المشرف</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
            <p id="error-msg"></p>
        </form>
    </div>

    <script type="module">
        import { auth } from '../firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = e.target.querySelector('button');
            
            btn.innerText = "جاري الدخول...";
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // إذا نجح الدخول، كنحولوه للوحة التحكم
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error(error);
                if(error.code === 'auth/invalid-credential') {
                    errorMsg.innerText = "الإيميل أو كلمة السر غالطة!";
                } else {
                    errorMsg.innerText = "مشكل: " + error.message;
                }
                btn.innerText = "تسجيل الدخول";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
