<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة | WitTing</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #238636;
      --green-2: #2ea043;
      --blue: #58a6ff;
      --danger: #f85149;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827 0%, var(--bg) 50%);
      color: var(--text);
      font-family: 'Tahoma', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-box {
      width: min(420px, 100%);
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 14px;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      height: 48px;
      padding: 12px 14px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      height: 48px;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      color: #fbbf24;
      text-align: center;
      font-size: 13px;
    }

    .link-back {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
    }

    .link-back a {
      color: var(--blue);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>WitTing Admin</h1>
    <div class="subtitle">تسجيل الدخول إلى لوحة الإدارة</div>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" placeholder="admin@example.com" required />

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" placeholder="••••••••" required />

      <button class="btn" type="submit">دخول</button>
      <div id="loginStatus" class="status"></div>
    </form>

    <div class="link-back">
      <a href="../index.html">العودة إلى الموقع</a>
    </div>
  </div>

  <script type="module" src="../assets/admin.js"></script>
</body>
</html>
