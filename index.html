<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wit-Ting | مشاهدة الأنمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1f1f1f;
            --surface-hover: #2a2a2a;
            --text: #f1f1f1;
            --text-muted: #aaaaaa;
            --accent: #e50914; /* أحمر نتفليكس */
            --glass-bg: rgba(30, 30, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 110px; /* مساحة للقائمة العائمة */
            -webkit-tap-highlight-color: transparent;
        }

        /* الهيدر */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo { font-size: 22px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }

        /* حاوية الصفحات */
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* شبكة الأغلفة (Grid) */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 15px 20px;
        }

        .anime-card {
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface);
            transition: transform 0.2s ease;
        }

        .anime-card:active { transform: scale(0.96); }

        .poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
            background: #333;
        }

        .anime-info { padding: 8px; text-align: center; }
        .anime-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .anime-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* ===== صفحة التفاصيل ===== */
        .back-btn {
            display: inline-flex; align-items: center; gap: 5px;
            color: var(--text); background: rgba(255,255,255,0.1);
            border: none; padding: 8px 15px; border-radius: 20px;
            margin: 15px 20px; cursor: pointer; font-weight: 600;
        }

        .hero-section {
            display: flex; gap: 15px; padding: 0 20px 20px;
        }
        
        .hero-poster {
            width: 140px; aspect-ratio: 2/3; border-radius: 10px;
            object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .hero-details { flex: 1; }
        .hero-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .hero-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { background: var(--surface); padding: 3px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); }
        .hero-desc { font-size: 13px; color: #ccc; line-height: 1.6; }

        /* قائمة الحلقات */
        .episodes-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        .episode-item {
            background: var(--surface); padding: 15px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: background 0.2s;
        }
        .episode-item:hover { background: var(--surface-hover); }
        .episode-title { font-weight: 600; font-size: 14px; }

        /* ===== القائمة السفلية العائمة (Floating Pill) ===== */
        .floating-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 65px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
        }

        .floating-nav.hidden {
            transform: translate(-50%, 150%);
            opacity: 0;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); text-decoration: none; font-size: 11px; gap: 3px;
            width: 60px; height: 100%; transition: color 0.3s; position: relative;
        }

        .nav-item.active { color: var(--text); font-weight: 700; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        .nav-item.active::after {
            content: '';
            position: absolute; bottom: 8px;
            width: 5px; height: 5px;
            background: var(--accent);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#e50914"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
            Wit-Ting
        </div>
    </header>

    <!-- الصفحة الرئيسية (الأغلفة) -->
    <main id="home-page" class="page active">
        <div class="anime-grid" id="animeGrid">
            <!-- سيتم ملء الأغلفة هنا عبر الجافاسكريبت -->
        </div>
    </main>

    <!-- صفحة تفاصيل الأنمي -->
    <main id="details-page" class="page">
        <button class="back-btn" onclick="showPage('home')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            رجوع
        </button>

        <div class="hero-section">
            <img id="detailPoster" class="hero-poster" src="" alt="Poster">
            <div class="hero-details">
                <h1 id="detailTitle" class="hero-title">اسم الأنمي</h1>
                <div id="detailTags" class="hero-tags"></div>
                <p id="detailDesc" class="hero-desc"></p>
            </div>
        </div>

        <h3 style="padding: 0 20px 10px; font-size: 16px;">الحلقات</h3>
        <div id="episodesList" class="episodes-list">
            <!-- قائمة الحلقات هنا -->
        </div>
    </main>

    <!-- القائمة السفلية العائمة -->
    <nav class="floating-nav" id="bottomNav">
        <a href="#" class="nav-item active" onclick="showPage('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            أفلام
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            أنمي
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            حسابي
        </a>
    </nav>

    <script>
        // 1. البيانات الوهمية للأنمي (يمكنك تعديلها لاحقاً)
        const animeData = [
            {
                id: 1,
                title: "Attack on Titan",
                poster: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400&auto=format&fit=crop",
                rating: "9.0",
                tags: ["أكشن", "دراما", "شونين"],
                desc: "بعد تدمير مدينته على يد العمالقة، يقسم إرين ييغر على الانتقام واستعادة الحرية للبشرية. قصة ملحمية عن البقاء والصمود.",
                episodes: [
                    { num: 1, title: "الحلقة 1: إلى أنت أيها اللاحق" },
                    { num: 2, title: "الحلقة 2: تلك الأيام" },
                    { num: 3, title: "الحلقة 3: وميض الضوء في اليأس" }
                ]
            },
            {
                id: 2,
                title: "Jujutsu Kaisen",
                poster: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=400&auto=format&fit=crop",
                rating: "8.8",
                tags: ["أكشن", "خارق للطبيعة"],
                desc: "يوكو إيتادوري يبتلع إصبعاً ملعوناً ويصبح وعاءً لروح لعنة قوية. ينضم إلى مدرسة جوجوتسو لقتال الأرواح الشريرة.",
                episodes: [
                    { num: 1, title: "الحلقة 1: ريومين سوكونا" },
                    { num: 2, title: "الحلقة 2: من أجلي" }
                ]
            },
            {
                id: 3,
                title: "One Piece",
                poster: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=400&auto=format&fit=crop",
                rating: "9.2",
                tags: ["مغامرات", "كوميدي", "فانتازيا"],
                desc: "مونكي دي لوفي يبحث عن الكنز الأسطوري (ون بيس) ليصبح ملك القراصنة. رحلة مليئة بالمغامرات والأصدقاء.",
                episodes: [
                    { num: 1, title: "الحلقة 1: أنا لوفي!" },
                    { num: 2, title: "الحلقة 2: صائد القراصنة الشهير" }
                ]
            }
        ];

        // 2. دالة عرض الأغلفة في الصفحة الرئيسية
        function renderGrid() {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = animeData.map(anime => `
                <div class="anime-card" onclick="openAnime(${anime.id})">
                    <img src="${anime.poster}" alt="${anime.title}" class="poster" loading="lazy">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-meta">⭐ ${anime.rating}</div>
                    </div>
                </div>
            `).join('');
        }

        // 3. دالة فتح صفحة الأنمي
        function openAnime(id) {
            const anime = animeData.find(a => a.id === id);
            if(!anime) return;

            document.getElementById('detailPoster').src = anime.poster;
            document.getElementById('detailTitle').innerText = anime.title;
            document.getElementById('detailDesc').innerText = anime.desc;
            
            // إضافة الأنواع (Tags)
            document.getElementById('detailTags').innerHTML = anime.tags.map(t => `<span class="tag">${t}</span>`).join('');

            // عرض الحلقات
            document.getElementById('episodesList').innerHTML = anime.episodes.map(ep => `
                <div class="episode-item">
                    <span class="episode-title">${ep.title}</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent)"><path d="M8 5v14l11-7z"/></svg>
                </div>
            `).join('');

            showPage('details');
        }

        // 4. دالة التنقل بين الصفحات
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            window.scrollTo(0, 0); // العودة لأعلى الصفحة
        }

        // 5. حركة إخفاء وإظهار القائمة العائمة عند السكرول
        let lastScrollTop = 0;
        const nav = document.getElementById('bottomNav');

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                nav.classList.add('hidden'); // إخفاء عند النزول
            } else {
                nav.classList.remove('hidden'); // إظهار عند الصعود
            }
            lastScrollTop = scrollTop;
        });

        // تشغيل عرض الأغلفة عند فتح الموقع
        renderGrid();
    </script>
</body>
</html>
