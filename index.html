<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wit-Ting | منصة المشاهدة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. المتغيرات وإعدادات النظام (System Variables)
           ========================================= */
        :root {
            --bg-main: #0a0a0a;
            --bg-surface: #151515;
            --bg-surface-hover: #222222;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-color: #6366f1; /* لون بنفسجي احترافي */
            --accent-hover: #4f46e5;
            --glass-bg: rgba(20, 20, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --nav-height: 70px;
            --header-height: 60px;
        }

        /* =========================================
           2. إعادة ضبط العناصر (Reset)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--bg-surface-hover); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        svg { display: block; }

        /* =========================================
           3. الهيدر (Header)
           ========================================= */
        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* =========================================
           4. شريط البحث (Search Bar)
           ========================================= */
        .search-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .search-container.active { display: flex; flex-direction: column; }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 10px 20px;
            margin-top: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
            font-family: 'Cairo';
        }

        .search-close {
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 15px;
        }

        /* =========================================
           5. الصفحات الرئيسية (Views)
           ========================================= */
        .view-section {
            display: none;
            padding-top: calc(var(--header-height) + 20px);
            animation: fadeIn 0.4s ease-out forwards;
        }

        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           6. الصفحة الرئيسية (Home View)
           ========================================= */
        .hero-slider {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 5s ease;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-main) 0%, transparent 80%),
                        linear-gradient(to right, var(--bg-main) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-desc {
            font-size: 14px;
            color: #ddd;
            max-width: 600px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-color);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: fit-content;
        }

        .btn-primary:hover { background: var(--accent-hover); transform: scale(1.05); }
        .btn-primary svg { width: 18px; height: 18px; fill: white; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 15px;
        }

        .section-title {
            font-size:L 20px;
            font-weight: 800;
            display14: flex;
            align-items: center;
             gap: 10px;
        }

        .6section-title::before {
            content: '';
            display:l block;
            width: 4px;
-            height: 20px;
            background: var(--accent-color);
            border-radius: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 0 15px;
            margin-bottom: 40px;
        }

        .media-card {
            cursor: pointer;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: var(--bg-surface);
        }

        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .media-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        .media-rating {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            color: #fbbf24;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .media-rating svg { width: 12px; height: 12px; fill: #fbbf24; }

        .media-info {
            padding: 10px;
            text-align: center;
        }

        .media-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .media-type {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* =========================================
           7. صفحة التفاصيل (Details View)
           ========================================= */
        .details-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 400px;
            object-fit: cover;
            z-index: -1;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .details-content {
            padding: 30px 20px;
            margin-top: 150px;
        }

        .details-header {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .details-poster {
            width: 140px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .details-text h1 { font-size: 26px; font-weight: 900; margin-bottom: 10px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .tag-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .synopsis {
            color: #bbb;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .episode-btn {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .episode-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* =========================================
           8. صفحة المشاهدة (Watch View)
           ========================================= */
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .watch-info {
            padding: 20px;
        }

        .watch-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .watch-meta { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .server-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .server-btn {
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
        }

        .server-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        .nav-episodes {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-ep-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* =========================================
           9. القائمة السفلية العائمة (Glassmorphism Bottom Nav)
           ========================================= */
        .floating-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            height: var(--nav-height);
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 3000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
        }

        .floating-nav.hidden {
            transform: translate(-50%, 150%);
            opacity: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            width: 65px;
            height: 100%;
            transition: color 0.3s;
            position: relative;
            cursor: pointer;
        }

        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active { color: var(--text-main); }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 8px;
            width: 5px;
            height: 5px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* =========================================
           10. استعلامات الوسائط (Media Queries)
           ========================================= */
        @media (min-width: 768px) {
            .hero-slider { height: 500px; border-radius: 30px; margin: 20px; }
            .hero-title { font-size: 48px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .details-header { gap: 40px; }
            .details-poster { width: 220px; }
            .video-container { border-radius: 20px; margin: 20px; width: calc(100% - 40px); }
        }

        .hidden { display: none !important; }
    </style>
</head>

        </div>
        <div class="nav-item" onclick="alert('سيتم إضافة قسم المسلسلات قريباً!')">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            مسلسلات
        </div>
        <div class="nav-item" onclick="router.navigate('profile')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            حسابي
        </div>
    </nav>

    <!-- =========================================
         الجافاسكريبت (الدماغ والعقل المدبر للموقع)
         ========================================= -->
    <script>
        // 1. قاعدة البيانات الوهمية (Data)
        const db = [
            {
                id: 'aot',
                title: 'Attack on Titan',
                type: 'أنمي',
                rating: '9.0',
                poster: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop',
                backdrop: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200&auto=format&fit=crop',
                tags: ['أكشن', 'دراما', 'شونين'],
                synopsis: 'بعد تدمير مدينته على يد العمالقة، يقسم إرين ييغر على الانتقام واستعادة الحرية للبشرية. قصة ملحمية عن البقاء والصمود في وجه اليأس.',
                episodes: [
                    { id: 1, title: 'الحلقة 1: إلى أنت أيها اللاحق', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
                    { id: 2, title: 'الحلقة 2: تلك الأيام', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' },
                    { id: 3, title: 'الحلقة 3: وميض الضوء في اليأس', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' }
                ]
            },
            {
                id: 'jjk',
                title: 'Jujutsu Kaisen',
                type: 'أنمي',
                rating: '8.8',
                poster: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop',
                backdrop: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1200&auto=format&fit=crop',
                tags: ['أكشن', 'خارق للطبيعة', 'مدرسي'],
                synopsis: 'يوكو إيتادوري يبتلع إصبعاً ملعوناً ويصبح وعاءً لروح لعنة قوية. ينضم إلى مدرسة جوجوتسو لقتال الأرواح الشريرة وحماية العالم.',
                episodes: [
                    { id: 1, title: 'الحلقة 1: ريومين سوكونا', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
                    { id: 2, title: 'الحلقة 2: من أجلي', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4' }
                ]
            },
            {
                id: 'inception',
                title: 'Inception',
                type: 'فيلم',
                rating: '9.1',
                poster: 'https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=600&auto=format&fit=crop',
                backdrop: 'https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=1200&auto=format&fit=crop',
                tags: ['خيال علمي', 'أكشن', 'غموض'],
                synopsis: 'لص محترف يسرق المعلومات من العقل الباطن للآخرين أثناء أحلامهم، يتلقى مهمة صعبة تتمثل في زرع فكرة داخل عقل هدف معين.',
                episodes: [
                    { id: 1, title: 'الفيلم كامل - جودة عالية', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' }
                ]
            },
            {
                id: 'onepiece',
                title: 'One Piece',
                type: 'أنمي',
                rating: '9.2',
                poster: 'https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=600&auto=format&fit=crop',
                backdrop: 'https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=1200&auto=format&fit=crop',
                tags: ['مغامرات', 'كوميدي', 'فانتازيا'],
                synopsis: 'مونكي دي لوفي يبحث عن الكنز الأسطوري (ون بيس) ليصبح ملك القراصنة. رحلة مليئة بالمغامرات والأصدقاء والقتال ضد الأشرار.',
                episodes: [
                    { id: 1, title: 'الحلقة 1: أنا لوفي!', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4' }
                ]
            }
        ];

        // 2. نظام التوجيه (Router)
        const router = {
            navigate: function(page, id = null, epId = null) {
                // إخفاء كل الصفحات
                document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
                
                // إزالة التفعيل من القائمة السفلية
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

                if (page === 'home') {
                    document.getElementById('view-home').classList.add('active');
                    document.querySelectorAll('.nav-item')[0].classList.add('active');
                    window.location.hash = '#home';
                } 
                else if (page === 'profile') {
                    document.getElementById('view-profile').classList.add('active');
                    document.querySelectorAll('.nav-item')[3].classList.add('active');
                    window.location.hash = '#profile';
                }
                else if (page === 'details' && id) {
                    this.loadDetails(id);
                    document.getElementById('view-details').classList.add('active');
                    window.location.hash = `#details/${id}`;
                }
                else if (page === 'watch' && id && epId) {
                    this.loadWatch(id, epId);
                    document.getElementById('view-watch').classList.add('active');
                    window.location.hash = `#watch/${id}/${epId}`;
                }
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            loadDetails: function(id) {
                const anime = db.find(a => a.id === id);
                if(!anime) return;

                document.getElementById('detailBackdrop').src = anime.backdrop;
                document.getElementById('detailPoster').src = anime.poster;
                document.getElementById('detailTitle').innerText = anime.title;
                document.getElementById('detailSynopsis').innerText = anime.synopsis;
                
                // Tags
                document.getElementById('detailTags').innerHTML = anime.tags.map(t => `<span class="tag-badge">${t}</span>`).join('');

                // Episodes
                document.getElementById('detailEpisodes').innerHTML = anime.episodes.map(ep => `
                    <div class="episode-btn" onclick="router.navigate('watch', '${anime.id}', ${ep.id})">
                        ${ep.title.split(':')[0]} <!-- يعرض فقط كلمة الحلقة ورقمها -->
                    </div>
                `).join('');
            },

            loadWatch: function(id, epId) {
                const anime = db.find(a => a.id === id);
                const episode = anime.episodes.find(e => e.id === epId);
                if(!anime || !episode) return;

                document.getElementById('watchTitle').innerText = episode.title;
                document.getElementById('watchAnimeName').innerText = anime.title;
                
                const video = document.getElementById('mainVideo');
                video.src = episode.url;
                video.poster = anime.backdrop;
                video.load();
            }
        };

        // 3. دوال عرض المحتوى
        function renderHome() {
            // عرض السلايدر (البانر)
            const heroAnime = db[0]; // أول أنمي
            document.getElementById('heroSection').innerHTML = `
                <img src="${heroAnime.backdrop}" class="hero-image">
                <div class="hero-overlay">
                    <h1 class="hero-title">${heroAnime.title}</h1>
                    <p class="hero-desc">${heroAnime.synopsis}</p>
                    <button class="btn-primary" onclick="router.navigate('details', '${heroAnime.id}')">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        مشاهدة الآن
                    </button>
                </div>
            `;

            // عرض الشبكة
            const gridHTML = db.map(anime => `
                <div class="media-card" onclick="router.navigate('details', '${anime.id}')">
                    <img src="${anime.poster}" class="media-poster" loading="lazy">
                    <div class="media-rating">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        ${anime.rating}
                    </div>
                    <div class="media-info">
                        <div class="media-title">${anime.title}</div>
                        <div class="media-type">${anime.type}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('latestGrid').innerHTML = gridHTML;
            
            // فلترة الأفلام فقط
            const moviesHTML = db.filter(a => a.type === 'فيلم').map(anime => `
                <div class="media-card" onclick="router.navigate('details', '${anime.id}')">
                    <img src="${anime.poster}" class="media-poster" loading="lazy">
                    <div class="media-info">
                        <div class="media-title">${anime.title}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('moviesGrid').innerHTML = moviesHTML;
        }

        // 4. شاشة البحث
        function toggleSearch() {
            const overlay = document.getElementById('searchOverlay');
            overlay.classList.toggle('active');
            if(overlay.classList.contains('active')) {
                document.getElementById('searchInput').focus();
            } else {
                document.getElementById('searchInput').value = '';
                document.getElementById('searchResults').innerHTML = '';
            }
        }

        function searchLogic(query) {
            const resultsContainer = document.getElementById('searchResults');
            if(query.trim() === '') {
                resultsContainer.innerHTML = '';
                return;
            }
            
            const results = db.filter(a => a.title.toLowerCase().includes(query.toLowerCase()));
            
            if(results.length === 0) {
                resultsContainer.innerHTML = `<p style="color:#aaa; grid-column: 1/-1; text-align:center;">لا توجد نتائج مطابقة</p>`;
                return;
            }

            resultsContainer.innerHTML = results.map(anime => `
                <div class="media-card" onclick="toggleSearch(); router.navigate('details', '${anime.id}')">
                    <img src="${anime.poster}" class="media-poster">
                    <div class="media-info">
                        <div class="media-title">${anime.title}</div>
                    </div>
                </div>
            `).join('');
        }

        // 5. حركة القائمة السفلية (Scroll Hide/Show)
        let lastScrollTop = 0;
        const nav = document.getElementById('bottomNav');

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // إذا لم نكن في صفحة المشاهدة (لأن الفيديو يحتاج مساحة)
            if(document.getElementById('view-watch').classList.contains('active')) {
                nav.classList.add('hidden');
                return;
            }

            if (scrollTop > lastScrollTop && scrollTop > 50) {
                nav.classList.add('hidden'); // إخفاء
            } else {
                nav.classList.remove('hidden'); // إظهار
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        }, { passive: true });

        // 6. التشغيل الأولي
        window.addEventListener('load', () => {
            renderHome();
            // التحقق من وجود Hash في الرابط للدخول المباشر
            const hash = window.location.hash;
            if(hash.startsWith('#details/')) {
                router.navigate('details', hash.split('/')[1]);
            } else if(hash.startsWith('#watch/')) {
                const parts = hash.split('/');
                router.navigate('watch', parts[1], parseInt(parts[2]));
            } else if(hash === '#profile') {
                router.navigate('profile');
            }
        });
    </script>
</body>
</html>
