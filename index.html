<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wit-Ting |خيارك دائم لمشاهدة افخم افلامك وانمياتك المفضلة على شاشة العائلة</title>
    <!-- استدعاء خط عربي احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات أساسية */
        :root {
            --bg-color: #0f0f0f; /* أسود يوتيوب */
            --text-color: #f1f1f1;
            --glass-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff0000; /* أحمر يوتيوب */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* مساحة للقائمة السفلية */
        }

        /* الهيدر العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* شبكة الفيديوهات */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr; /* عمود واحد في الهاتف */
            gap: 20px;
            padding: 0 20px;
        }

        /* بطاقة الفيديو (Anime Card) */
        .video-card {
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: scale(1.02); /* تكبير خفيف عند تمرير الماوس (للكمبيوتر) */
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* نفس أبعاد يوتيوب */
            border-radius: 12px;
            overflow: hidden;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .video-info {
            padding: 12px 5px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* قص النص الطويل */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 13px;
            color: #aaaaaa;
        }

        /* القائمة السفلية الزجاجية (Glassmorphism) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px); /* تأثير الزجاج */
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* حركة سلسة */
        }

        /* كلاس باش نخفيو القائمة */
        .bottom-nav.hide {
            transform: translateY(100%);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaaaaa;
            text-decoration: none;
            font-size: 12px;
            gap: 4px;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--text-color);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* استعلامات الوسائط (للحاسوب) */
        @media (min-width: 600px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr); /* عمودين في التابلت */
            }
        }

        @media (min-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 أعمدة في الحاسوب */
            }
            
            /* في الحاسوب نخليو القائمة السفلية عائمة وتكون أصغر */
            .bottom-nav {
                width: 400px;
                left: 50%;
                transform: translateX(-50%);
                bottom: 20px;
                border-radius: 50px;
                border: 1px solid var(--glass-border);
            }
            
            .bottom-nav.hide {
                transform: translate(-50%, 150%); /* حركة الإخفاء في الحاسوب */
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#ff0000"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"></path></svg>
            Wit-Ting
        </div>
    </header>

    <!-- شبكة المحتوى -->
    <main class="video-grid">
        
        <!-- بطاقة فيديو تجريبية 1 -->
        <article class="video-card">
            <div class="thumbnail-container">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop" alt="Anime Cover" loading="lazy">
                <span class="duration-badge">24:00</span>
            </div>
            <div class="video-info">
                <h2 class="video-title">Attack on Titan - الحلقة 1 (مترجمة)</h2>
                <div class="video-meta">Wit-Ting • 1.2M مشاهدة</div>
            </div>
        </article>

        <!-- بطاقة فيديو تجريبية 2 -->
        <article class="video-card">
            <div class="thumbnail-container">
                <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=600&auto=format&fit=crop" alt="Movie Cover" loading="lazy">
                <span class="duration-badge">1:45:00</span>
            </div>
            <div class="video-info">
                <h2 class="video-title">فيلم Inception - مترجم بجودة عالية</h2>
                <div class="video-meta">Wit-Ting • 3.4M مشاهدة</div>
            </div>
        </article>

        <!-- بطاقة فيديو تجريبية 3 -->
        <article class="video-card">
            <div class="thumbnail-container">
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop" alt="Anime Cover" loading="lazy">
                <span class="duration-badge">24:00</span>
            </div>
            <div class="video-info">
                <h2 class="video-title">Jujutsu Kaisen - الحلقة 5 (مترجمة)</h2>
                <div class="video-meta">Wit-Ting • 850K مشاهدة</div>
            </div>
        </article>

    </main>

    <!-- القائمة السفلية الزجاجية -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            الأفلام
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            الأنمي
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            حسابي
        </a>
    </nav>

    <!-- سكريبت حركة الإخفاء والظهور -->
    <script>
        let lastScrollTop = 0;
        const bottomNav = document.getElementById('bottomNav');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // إذا كان السكرول للأسفل، نخفي القائمة
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                bottomNav.classList.add('hide');
            } else {
                // إذا كان السكرول للأعلى، نظهروا القائمة
                bottomNav.classList.remove('hide');
            }
            lastScrollTop = scrollTop;
        });
    </script>
</body>
</html>
